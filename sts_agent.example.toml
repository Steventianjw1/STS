# Copy to sts_agent.toml (in the folder you run sts-agent from) and edit.
# Keys are optional. No local model/text/action budgets apply by default.
# Supply a model via DEEPSEEK_MODEL, [llm].model, or --model.

# Gameplay policy: "llm" (default; configured model chooses every action) or "baseline"
# (explicit heuristic comparison mode, combat only; never used as a fallback).
policy = "llm"

# STS2MCP mod address. The mod listens on port 15526 by default.
# The port can be changed in <game>/mods/STS2_MCP.conf.
base_url = "http://127.0.0.1:15526"

read_timeout_s = 5.0      # GET state timeout
action_timeout_s = 10.0   # POST action timeout; a timeout here is treated as an AMBIGUOUS outcome

trace_dir = "traces"
record_raw = true         # also write debug_raw.jsonl (raw API responses; not training data)

# The API does not report the game build. Copy it from the game's main menu so traces record it.
# game_build = "v0.107.1"

# Optional: lets `doctor` read <game_dir>/mods/STS2_MCP.json. This path is never written to traces.
# game_dir = 'D:\SteamLibrary\steamapps\common\Slay the Spire 2'

# The agent only plays the game build its mod and simulator support (v0.107.1; see game/game_pin.py).
# `./start` saves a frozen copy of that build under <pinned_game_dir>/<build>, outside Steam's
# reach, and launches it when no game is running. `./start --pin-only` just saves the copy.
pinned_game_dir = "data/game"

# Enemy move-pattern reference (fetch with `python tools/fetch_monster_data.py`). Fills the
# combat prompt's offsets 2-3 after the observed next move. Data is pinned to v0.107.1;
# forecasts are base values, not native simulations. A missing file leaves them unknown.
monster_data_path = "data/monster_reference/monsters.json"

[limits]
# max_actions = 300                # optional explicit action cap; omitted = unlimited
max_no_progress_s = 90.0           # stop if the observed state never changes for this long
poll_interval_s = 0.25
ready_timeout_s = 60.0             # wait for the player's play phase (covers enemy turns)
settle_polls = 2                   # identical consecutive "ready" reads required before acting
play_resolution_timeout_s = 10.0   # accepted card play must visibly resolve within this
end_turn_resolution_timeout_s = 60.0
max_consecutive_rejections = 3
max_total_rejections = 10
# max_run_actions = 3000           # optional explicit run action cap; omitted = unlimited

[llm]
provider = "deepseek"              # or "anthropic" for the original Claude adapter
# Set DEEPSEEK_MODEL in .env, or set model here. No model is assumed.
# model = "<model id>"
# Set DEEPSEEK_API_KEY in .env. DEEPSEEK_BASE_URL optionally overrides https://api.deepseek.com.
# For anthropic, use ANTHROPIC_API_KEY instead. Never put credentials here.
# max_output_tokens = 16384        # optional override; DeepSeek default uses the provider limit
timeout_s = 60.0                   # SDK timeout per connect and per wait for data; a call that keeps
                                   # receiving bytes can run longer. SDK retries are disabled.
# provider_retries = 2             # optional cap; omitted = retry recoverable model failures
# corrective_retries = 1           # optional cap; omitted = keep requesting a valid action
deepseek_reasoning_effort = "medium" # none, low, medium (served as high), high, or max
# The strategic planner's own effort; "same" follows the line above. The planner is roughly half
# of all model time, most of it reasoning tokens (about 5 s per 1000). "low" measured about a third
# faster per planner call on one recorded state; its effect on play strength is not measured.
deepseek_strategy_reasoning_effort = "same"
# max_calls_per_run = 2000         # optional explicit shared model-call budget; omitted = unlimited
# max_input_tokens_per_run = 5000000
# max_output_tokens_per_run = 500000
# price_input_usd_per_mtok = 0.0   # set both prices to get an estimated cost in the summary
# price_output_usd_per_mtok = 0.0
# max_input_bytes = 98304          # optional local prompt cap; omitted = provider context limit only
# objective = "Win the run (ordinary victory) with the current character at the current difficulty."
strategic_planner = true
what_if_tools = true               # the model may spend one extra call per decision on deck_after / route_projection

[expert_stats]
enabled = true
cohort_size = 5                    # highest character Elo among the global top 100
min_character_runs = 30            # solo A10 standard rated runs on this character
# ascension = 10                   # omit to match observed ascension; no automatic broadening
match_version = true              # filter profiles by game_build above when known
lang = "eng"                      # event catalog language for exact title matching
cache_dir = "traces/spire_codex_cache"
cache_ttl_s = 86400.0              # memory + disk; expired data is not used
request_timeout_s = 3.0
max_fetch_s = 12.0                 # overall fetch budget per decision
history_enabled = true            # indexed floor/deck contexts and map evidence; also requires enabled=true
history_runs_per_player = 100      # bounded SQLite corpus under cache_dir; standard solo runs only
history_new_runs_per_decision = 3  # incremental sync; at most one run per player per decision
floor_window = 3                  # nearby floor +/- 3, then act, then indexed cohort
min_context_samples = 20          # report widening and sparse final samples
deck_similarity_min = 0.5         # base-card multiset Jaccard; excludes incomplete card identities
deck_advice_enabled = true        # requires an explicit permanent deck from the patched mod
route_planning_enabled = true     # map screens: HP-loss model per node class + path enumeration
route_candidates = 6              # labeled representative paths; prior/preparation alternatives may be dominated
route_max_routes = 2000           # distinct node-type sequences kept per map node
encounter_stats_bracket = "solo"  # fallback when own runs are too few: solo, a10, wr30, wr50, wr75
replan_hp_tolerance_pct = 15.0    # re-plan trigger: HP this far (% of max HP) from the projection
replan_gold_tolerance = 100       # re-plan trigger: gold this far from the projection
elite_readiness_enabled = true    # elite threats (Spire Codex catalogs) vs. the patched mod's permanent deck
elite_block_attack_pct = 20.0     # block gap rule: elite attack turn >= this % of max HP, or it gains Strength
elite_trigger_steps = 3           # re-plan trigger: planned elite within this many steps while gaps remain
boss_readiness_enabled = true     # card/shop screens: what the act boss asks of the deck, its fight stats and builds
ancient_advisor_enabled = true    # relic effects vs. deck/state, offer stats, community lift, patched act-map outlook
# Optional SPIRE_CODEX_API_KEY belongs in .env, never in this file.

# Autobattle (optional). The Spire Mentor mod (https://github.com/tfriedel/spire-mentor, MIT) can play a
# whole fight by itself; this is the only part of Mentor the agent uses. It needs the Spire Mentor mod
# installed beside STS2_MCP on a game build it supports. With enabled=true Mentor executes whole fights,
# including in-fight selections (except as offer_handoff says below), and the session stops on failure;
# the LLM makes every non-combat choice and never reads Mentor's advice. With enabled=false the LLM plays
# the fights itself.
[autobattle]
enabled = false
offer_handoff = true              # Mentor holds in-fight "choose a card" offers. One an enemy opens (a boss's
                                  # debuff choice) is decided by the LLM, because Mentor would score it as a
                                  # deck pick; any other goes back to Mentor's own pick. false: Mentor answers them all.
pilot = false                     # true: the agent's own combat search (src/sts_agent/pilot) picks every combat
                                  # move, tailored per encounter; Mentor's Autobattle still plays it. Needs
                                  # `python tools/fetch_mentor_source.py` once; applies from the next fight.
# pilot_source = "data/mentor_source"

# Interface (`./start` or `sts-agent ui`). One window holds the game and the panels around it: control bar
# above, combat log below, map plan / status / thinking on the right. It uses the frame host that ships with
# the Spire Mentor mod (mods/SpireMentor/SpireMentorFrame); without it, or with single_window = false, the
# game window is moved to the top-left of the screen and separate panel windows are tiled around it.
[ui]
single_window = true              # game and panels in one window; false: separate tiled windows
game_fraction = 0.70              # share of the window's width given to the game (0.4-0.9); tiled: of the screen
port = 0                          # localhost port of the interface; 0 picks a free one
# browser = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'  # default: Edge, then Chrome
live_thinking = true              # stream the model's reasoning into the Thinking panel (DeepSeek only; shown, never stored)
place_game_window = true          # tiled layout only. false: leave the game window where it is
