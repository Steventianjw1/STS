# Copy to sts_agent.toml (in the folder you run sts-agent from) and edit.
# Every key is optional; the values shown are the defaults, except [llm].model, which you must set.

# Gameplay policy: "llm" (default; configured model chooses every action) or "baseline"
# (explicit heuristic comparison mode, combat only; never used as a fallback).
policy = "llm"

# STS2MCP mod address. The mod listens on port 15526 by default.
# The port can be changed in <game>/mods/STS2_MCP.conf.
base_url = "http://127.0.0.1:15526"

read_timeout_s = 5.0      # GET state timeout
action_timeout_s = 10.0   # POST action timeout; a timeout here is treated as an AMBIGUOUS outcome

trace_dir = "traces"
record_raw = true         # also write debug_raw.jsonl (raw API responses; not training data)

# The API does not report the game build. Copy it from the game's main menu so traces record it.
# game_build = "v0.107.1"

# Optional: lets `doctor` read <game_dir>/mods/STS2_MCP.json. This path is never written to traces.
# game_dir = 'D:\SteamLibrary\steamapps\common\Slay the Spire 2'

# Enemy move-pattern reference (fetch with `python tools/fetch_monster_data.py`). Fills the
# combat prompt's next-turn enemy predictions. A missing file leaves offsets 2-3 unknown.
monster_data_path = "data/monster_reference/monsters.json"

[limits]
max_actions = 300                  # card plays + end turns per play-combat session
max_elapsed_s = 1200.0             # wall clock per session
max_no_progress_s = 90.0           # stop if the observed state never changes for this long
poll_interval_s = 0.25
ready_timeout_s = 60.0             # wait for the player's play phase (covers enemy turns)
settle_polls = 2                   # identical consecutive "ready" reads required before acting
play_resolution_timeout_s = 10.0   # accepted card play must visibly resolve within this
end_turn_resolution_timeout_s = 60.0
max_consecutive_rejections = 3
max_total_rejections = 10
max_run_actions = 3000             # per play-run session

[llm]
provider = "deepseek"              # or "anthropic" for the original Claude adapter
# Set DEEPSEEK_MODEL in .env, or set model here. No model is assumed.
# model = "<model id>"
# Set DEEPSEEK_API_KEY in .env. DEEPSEEK_BASE_URL optionally overrides https://api.deepseek.com.
# For anthropic, use ANTHROPIC_API_KEY instead. Never put credentials here.
max_output_tokens = 4096
timeout_s = 60.0                   # whole call; SDK retries are disabled
max_calls_per_run = 2000           # decision + strategic calls
# max_input_tokens_per_run = 5000000
# max_output_tokens_per_run = 500000
# price_input_usd_per_mtok = 0.0   # set both prices to get an estimated cost in the summary
# price_output_usd_per_mtok = 0.0
max_input_bytes = 98304            # decision prompt size; oldest history trimmed first, facts never trimmed
# objective = "Win the run (ordinary victory) with the current character at the current difficulty."
strategic_planner = true

[expert_stats]
enabled = true
cohort_size = 5                    # highest character Elo among the global top 100
min_character_runs = 30            # solo A10 standard rated runs on this character
# ascension = 10                   # omit to match observed ascension; no automatic broadening
match_version = true              # filter profiles by game_build above when known
lang = "eng"                      # event catalog language for exact title matching
cache_dir = "traces/spire_codex_cache"
cache_ttl_s = 86400.0              # memory + disk; expired data is not used
request_timeout_s = 3.0
max_fetch_s = 12.0                 # overall fetch budget per decision; remaining run budget also applies
history_enabled = true
history_runs_per_player = 100      # bounded SQLite corpus under cache_dir; standard solo runs only
history_new_runs_per_decision = 3  # incremental sync; at most one run per player per decision
floor_window = 3                  # nearby floor +/- 3, then act, then indexed cohort
min_context_samples = 20          # report widening and sparse final samples
deck_similarity_min = 0.5         # base-card multiset Jaccard; excludes incomplete card identities
deck_advice_enabled = true        # requires an explicit permanent deck from the patched mod
route_planning_enabled = true     # map screens: HP-loss model per node class + path enumeration
route_candidates = 6              # non-dominated paths shown to the model (labeled, never scored)
route_max_routes = 2000           # distinct node-type sequences kept per map node
encounter_stats_bracket = "solo"  # fallback when own runs are too few: solo, a10, wr30, wr50, wr75
replan_hp_tolerance_pct = 15.0    # re-plan trigger: HP this far (% of max HP) from the projection
replan_gold_tolerance = 100       # re-plan trigger: gold this far from the projection
elite_readiness_enabled = true    # elite threats (Spire Codex catalogs) vs. the patched mod's permanent deck
elite_block_attack_pct = 20.0     # block gap rule: elite attack turn >= this % of max HP, or it gains Strength
elite_trigger_steps = 3           # re-plan trigger: planned elite within this many steps while gaps remain
ancient_advisor_enabled = true    # ancient screens: relic effects vs. deck/state, expert offer stats, community lift
# Optional SPIRE_CODEX_API_KEY belongs in .env, never in this file.
